applications:
  - name: ssh-tunnel
    memory: 64M
    disk_quota: 1024M
    instances: 1
    buildpacks:
      - https://github.com/cloudfoundry/apt-buildpack
      - staticfile_buildpack
    env:
      CF_APP_NAME: ssh-tunnel
      CF_S3_BACKUPS_SERVICE_NAME: ((cfS3BackupsServiceName))
      CF_S3_BACKUP_TARGET_SERVICE_NAMES: ((cfS3BackupTargetServiceNames))
    no-route: true
    services:
      - camd-pg-db
      #- backups # Must bind manually to specify `additional_buckets`
      - mats-bulk-files-import
    command: ./scripts/supercronic.sh 2>&1
